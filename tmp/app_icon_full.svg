<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="50%" stop-color="#0F2444"/>
      <stop offset="100%" stop-color="#1A3A68"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFEE58"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Solid rounded/square background base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Subtle outer circular border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.12"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Main Shield Emblem with Shadow -->
  <g filter="url(#glow)">
    <!-- Shield Outer Gold Border -->
    <path d="M 256,92 C 322,92 384,106 384,106 C 384,222 344,334 256,406 C 168,334 128,222 128,106 C 128,106 190,92 256,92 Z"
          fill="url(#goldGrad)"/>

    <!-- Shield Navy Core -->
    <path d="M 256,106 C 314,106 368,118 368,118 C 368,220 332,320 256,386 C 180,320 144,220 144,118 C 144,118 198,106 256,106 Z"
          fill="#0B1E3F"/>

    <!-- Inner Shield Inset Ring -->
    <path d="M 256,118 C 304,118 350,128 350,128 C 350,214 318,304 256,364 C 194,304 162,214 162,128 C 162,128 208,118 256,118 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Three Stars in Arc -->
    <!-- Center Star -->
    <polygon points="256,128 261,142 276,142 264,151 268,165 256,156 244,165 248,151 236,142 251,142" fill="#FFFFFF"/>
    <!-- Left Star -->
    <polygon points="214,136 218,148 231,148 221,156 224,168 214,160 204,168 207,156 197,148 210,148" fill="url(#goldGrad)"/>
    <!-- Right Star -->
    <polygon points="298,136 302,148 315,148 305,156 308,168 298,160 288,168 291,156 281,148 294,148" fill="url(#goldGrad)"/>

    <!-- Classical Civic Pediment / Temple Roof -->
    <polygon points="256,174 182,216 330,216" fill="#FFFFFF"/>
    <!-- Pediment Gold Accent Border -->
    <polyline points="180,216 256,172 332,216" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Entablature Bar -->
    <rect x="182" y="218" width="148" height="12" rx="2" fill="#FFFFFF"/>
    <rect x="184" y="222" width="144" height="4" fill="url(#goldGrad)"/>

    <!-- 4 Civic Columns -->
    <rect x="196" y="234" width="16" height="66" rx="2" fill="#FFFFFF"/>
    <rect x="230" y="234" width="16" height="66" rx="2" fill="#FFFFFF"/>
    <rect x="266" y="234" width="16" height="66" rx="2" fill="#FFFFFF"/>
    <rect x="300" y="234" width="16" height="66" rx="2" fill="#FFFFFF"/>

    <!-- Column Fluting Details -->
    <line x1="204" y1="238" x2="204" y2="296" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="238" y1="238" x2="238" y2="296" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="274" y1="238" x2="274" y2="296" stroke="#D1D5DB" stroke-width="2"/>
    <line x1="308" y1="238" x2="308" y2="296" stroke="#D1D5DB" stroke-width="2"/>

    <!-- Column Base Plinth / Steps -->
    <rect x="178" y="302" width="156" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="170" y="314" width="172" height="10" rx="2" fill="#FFFFFF"/>
    <rect x="166" y="318" width="180" height="4" fill="url(#goldGrad)"/>

    <!-- Open Civics Book Emblem -->
    <path d="M 256,334 C 242,324 212,324 194,328 V 364 C 212,360 242,360 256,370 C 270,360 300,360 318,364 V 328 C 300,324 270,324 256,334 Z"
          fill="url(#goldGrad)"/>
    <path d="M 256,334 V 370" stroke="#0B1E3F" stroke-width="3"/>
    <!-- Page lines in book -->
    <line x1="206" y1="338" x2="244" y2="344" stroke="#7A5600" stroke-width="1.5"/>
    <line x1="206" y1="346" x2="244" y2="352" stroke="#7A5600" stroke-width="1.5"/>
    <line x1="268" y1="344" x2="306" y2="338" stroke="#7A5600" stroke-width="1.5"/>
    <line x1="268" y1="352" x2="306" y2="346" stroke="#7A5600" stroke-width="1.5"/>

    <!-- Central Liberty Torch (Overlaid in middle between columns) -->
    <!-- Torch Handle -->
    <polygon points="253,248 259,248 257,288 255,288" fill="url(#goldGrad)"/>
    <!-- Torch Cup -->
    <path d="M 248,248 C 248,256 264,256 264,248 L 268,240 H 244 Z" fill="url(#goldGrad)"/>
    <!-- Torch Flame -->
    <path d="M 256,204 C 263,216 270,224 266,234 C 263,240 259,242 256,242 C 253,242 249,240 246,234 C 242,224 249,216 256,204 Z"
          fill="url(#flameGrad)"/>
    <!-- Flame Inner Core -->
    <path d="M 256,218 C 260,226 263,230 260,238 C 258,240 256,241 256,241 C 256,241 254,240 252,238 C 249,230 252,226 256,218 Z"
          fill="#FFFFFF"/>
  </g>
</svg>
